<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b16"/>
      <stop offset="100%" style="stop-color:#0b1628"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a70"/>
      <stop offset="100%" style="stop-color:#0f2050"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b46a"/>
      <stop offset="100%" style="stop-color:#c8893a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8893a;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#c8893a;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c8893a"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a7ab8"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="url(#bg4)" rx="16"/>

  <!-- Subtle dot grid -->
  <g opacity="0.07">
    <circle cx="75" cy="75" r="1" fill="#c8893a"/>  <circle cx="225" cy="75" r="1" fill="#c8893a"/>
    <circle cx="375" cy="75" r="1" fill="#c8893a"/>  <circle cx="525" cy="75" r="1" fill="#c8893a"/>
    <circle cx="675" cy="75" r="1" fill="#c8893a"/>  <circle cx="825" cy="75" r="1" fill="#c8893a"/>
    <circle cx="75" cy="200" r="1" fill="#c8893a"/> <circle cx="225" cy="200" r="1" fill="#c8893a"/>
    <circle cx="375" cy="200" r="1" fill="#c8893a"/> <circle cx="525" cy="200" r="1" fill="#c8893a"/>
    <circle cx="675" cy="200" r="1" fill="#c8893a"/> <circle cx="825" cy="200" r="1" fill="#c8893a"/>
    <circle cx="75" cy="325" r="1" fill="#c8893a"/> <circle cx="225" cy="325" r="1" fill="#c8893a"/>
    <circle cx="375" cy="325" r="1" fill="#c8893a"/> <circle cx="525" cy="325" r="1" fill="#c8893a"/>
    <circle cx="675" cy="325" r="1" fill="#c8893a"/> <circle cx="825" cy="325" r="1" fill="#c8893a"/>
  </g>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#ffffff" font-weight="bold" letter-spacing="1">ORDER-TO-CASH PROCESS FLOW</text>
  <text x="450" y="56" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" letter-spacing="3">SAP SD END-TO-END · PRASHANTH GOUD</text>
  <line x1="50" y1="68" x2="850" y2="68" stroke="#c8893a" stroke-width="1" opacity="0.3"/>

  <!-- ════════════ FLOW ROW 1 ════════════ -->
  <!-- CUSTOMER -->
  <ellipse cx="75" cy="160" rx="52" ry="30" fill="url(#goldGrad)" filter="url(#glow4)"/>
  <text x="75" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0a0f1e" font-weight="bold">CUSTOMER</text>
  <text x="75" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#0a0f1e">REQUEST</text>

  <!-- Arrow -->
  <line x1="130" y1="160" x2="168" y2="160" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- INQUIRY -->
  <rect x="172" y="136" width="96" height="48" rx="8" fill="url(#nodeGrad)" stroke="#c8893a" stroke-width="1.5"/>
  <text x="220" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffffff" font-weight="bold">Inquiry</text>
  <text x="220" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a">VA11</text>

  <!-- Arrow -->
  <line x1="268" y1="160" x2="306" y2="160" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- QUOTATION -->
  <rect x="310" y="136" width="96" height="48" rx="8" fill="url(#nodeGrad)" stroke="#c8893a" stroke-width="1.5"/>
  <text x="358" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffffff" font-weight="bold">Quotation</text>
  <text x="358" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a">VA21</text>

  <!-- Arrow -->
  <line x1="406" y1="160" x2="444" y2="160" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- SALES ORDER -->
  <rect x="448" y="130" width="110" height="60" rx="8" fill="#1a3a6b" stroke="#e8b46a" stroke-width="2.5" filter="url(#glow4)"/>
  <text x="503" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ffffff" font-weight="bold">Sales</text>
  <text x="503" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ffffff" font-weight="bold">Order</text>
  <text x="503" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#e8b46a">VA01</text>

  <!-- Credit check branch (down from order) -->
  <line x1="503" y1="190" x2="503" y2="218" stroke="#4a7ab8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowheadBlue)"/>
  <rect x="455" y="222" width="96" height="34" rx="6" fill="#0d1628" stroke="#4a7ab8" stroke-width="1"/>
  <text x="503" y="237" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#4a7ab8">Credit Check</text>
  <text x="503" y="249" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#3a5070">FD32 / OVA8</text>

  <!-- ATP check branch (up from order) -->
  <line x1="503" y1="130" x2="503" y2="102" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowheadGreen)"/>
  <rect x="455" y="80" width="96" height="34" rx="6" fill="#0d1628" stroke="#22c55e" stroke-width="1"/>
  <text x="503" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">ATP Check</text>
  <text x="503" y="107" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#1a5030">Avail. Check</text>

  <!-- Arrow -->
  <line x1="558" y1="160" x2="596" y2="160" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- DELIVERY -->
  <rect x="600" y="136" width="96" height="48" rx="8" fill="url(#nodeGrad)" stroke="#c8893a" stroke-width="1.5"/>
  <text x="648" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffffff" font-weight="bold">Delivery</text>
  <text x="648" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a">VL01N</text>

  <!-- Arrow -->
  <line x1="696" y1="160" x2="734" y2="160" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- PGI -->
  <rect x="738" y="136" width="96" height="48" rx="8" fill="url(#nodeGrad)" stroke="#c8893a" stroke-width="1.5"/>
  <text x="786" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">Post Goods</text>
  <text x="786" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">Issue</text>
  <text x="786" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a">VL02N·PGI</text>

  <!-- ════════════ FLOW ROW 2 ════════════ -->
  <!-- Arrow down from PGI -->
  <line x1="786" y1="184" x2="786" y2="290" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- BILLING -->
  <rect x="738" y="294" width="96" height="48" rx="8" fill="#1a3a6b" stroke="#e8b46a" stroke-width="2" filter="url(#glow4)"/>
  <text x="786" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffffff" font-weight="bold">Billing</text>
  <text x="786" y="329" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#e8b46a">VF01/VF04</text>

  <!-- Arrow left from billing -->
  <line x1="738" y1="318" x2="700" y2="318" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- FI POSTING -->
  <rect x="600" y="294" width="96" height="48" rx="8" fill="url(#nodeGrad)" stroke="#c8893a" stroke-width="1.5"/>
  <text x="648" y="311" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">FI Posting</text>
  <text x="648" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">&amp; Revenue</text>
  <text x="648" y="339" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a">FB03·VKOA</text>

  <!-- Arrow left -->
  <line x1="600" y1="318" x2="562" y2="318" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- AR OPEN ITEM -->
  <rect x="462" y="294" width="96" height="48" rx="8" fill="url(#nodeGrad)" stroke="#c8893a" stroke-width="1.5"/>
  <text x="510" y="311" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">Customer</text>
  <text x="510" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">AR Item</text>
  <text x="510" y="339" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a">FBL5N</text>

  <!-- Arrow left -->
  <line x1="462" y1="318" x2="424" y2="318" stroke="#c8893a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- PAYMENT -->
  <ellipse cx="375" cy="318" rx="52" ry="28" fill="url(#greenGrad)" filter="url(#glow4)"/>
  <text x="375" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="bold">Payment</text>
  <text x="375" y="328" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#d0ffe0">F-28</text>

  <!-- Pricing box on sales order process -->
  <rect x="172" y="270" width="230" height="80" rx="8" fill="#0c1420" stroke="#c8893a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="172" y="270" width="230" height="4" rx="2" fill="#c8893a" opacity="0.6"/>
  <text x="287" y="289" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" letter-spacing="1">PRICING DETERMINATION</text>
  <text x="287" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8ab4d8">Procedure → Condition Type</text>
  <text x="287" y="319" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8ab4d8">Access Sequence → Table</text>
  <text x="287" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8ab4d8">Record → Amount (VK11)</text>

  <!-- Labels for sub-processes under delivery -->
  <text x="648" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#3a5070">Picking · Packing</text>
  <text x="648" y="216" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#3a5070">Shipping · Route Det.</text>

  <!-- Legend -->
  <rect x="50" y="388" width="800" height="66" rx="8" fill="#0c1420" stroke="#1a3a6b" stroke-width="1"/>
  <text x="450" y="407" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c8893a" letter-spacing="2">TRANSACTION REFERENCE</text>
  <text x="90" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">VA11/VA21</text>
  <text x="90" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">Presales</text>
  <text x="200" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">VA01/VA02</text>
  <text x="200" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">Sales Order</text>
  <text x="320" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">VL01N/VL02N</text>
  <text x="320" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">Delivery</text>
  <text x="450" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">VF01/VF04</text>
  <text x="450" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">Billing</text>
  <text x="560" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">VK11/OVKK</text>
  <text x="560" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">Pricing</text>
  <text x="670" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">FBL5N/F-28</text>
  <text x="670" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">FI/AR</text>
  <text x="760" y="426" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">OVA8/FD32</text>
  <text x="760" y="440" font-family="Georgia, serif" font-size="9" fill="#3a5070">Credit Mgmt</text>

  <text x="450" y="466" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#1a2a3a" letter-spacing="2">PRASHANTH GOUD · SAP SD / S/4HANA CONSULTANT · github.com/prashanth-sap-sd</text>
</svg>
