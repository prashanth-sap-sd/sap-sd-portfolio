<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c18"/>
      <stop offset="100%" style="stop-color:#0c1830"/>
    </linearGradient>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8893a;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:0.35"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg3)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#ffffff" font-weight="bold" letter-spacing="1">SAP SD COMPETENCY MAP</text>
  <text x="450" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#c8893a" letter-spacing="3">PRASHANTH GOUD · 10+ YEARS DEPTH</text>
  <line x1="60" y1="72" x2="840" y2="72" stroke="#c8893a" stroke-width="1" opacity="0.35"/>

  <!-- ── RADAR CHART (centered at 290, 295) ── -->
  <!-- Grid circles -->
  <circle cx="290" cy="295" r="30" fill="none" stroke="#1a3a6b" stroke-width="1" opacity="0.6"/>
  <circle cx="290" cy="295" r="60" fill="none" stroke="#1a3a6b" stroke-width="1" opacity="0.6"/>
  <circle cx="290" cy="295" r="90" fill="none" stroke="#1a3a6b" stroke-width="1" opacity="0.6"/>
  <circle cx="290" cy="295" r="120" fill="none" stroke="#1a3a6b" stroke-width="1" opacity="0.6"/>
  <circle cx="290" cy="295" r="150" fill="none" stroke="#1a3a6b" stroke-width="1" opacity="0.4"/>

  <!-- Radar spokes (6 axes, 60 degrees apart) -->
  <!-- 0°: top -->
  <line x1="290" y1="295" x2="290" y2="145" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- 60°: top-right -->
  <line x1="290" y1="295" x2="420" y2="220" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- 120°: bottom-right -->
  <line x1="290" y1="295" x2="420" y2="370" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- 180°: bottom -->
  <line x1="290" y1="295" x2="290" y2="445" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- 240°: bottom-left -->
  <line x1="290" y1="295" x2="160" y2="370" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- 300°: top-left -->
  <line x1="290" y1="295" x2="160" y2="220" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>

  <!-- 
    Skills at 95% of max (150px):
    OTC=143, Pricing=143, S4=132, Billing=135, LE=128, Integration=120
    Positions (center 290,295):
    0° top: (290, 295-143) = (290, 152)
    60°: center + 143*(sin60, -cos60) = (290+124, 295-71) = (414, 224)
    120°: (290+114, 295+68) = (404, 363)
    180°: (290, 295+135) = (290, 430)
    240°: (290-111, 295+64) = (179, 359)
    300°: (290-104, 295-60) = (186, 235)
  -->
  <polygon 
    points="290,152 414,224 404,363 290,430 179,359 186,235"
    fill="url(#radarFill)" 
    stroke="#c8893a" 
    stroke-width="2"
    filter="url(#softglow)"
    opacity="0.9"/>

  <!-- Data points on radar -->
  <circle cx="290" cy="152" r="5" fill="#c8893a" filter="url(#glow3)"/>
  <circle cx="414" cy="224" r="5" fill="#c8893a" filter="url(#glow3)"/>
  <circle cx="404" cy="363" r="5" fill="#c8893a" filter="url(#glow3)"/>
  <circle cx="290" cy="430" r="5" fill="#c8893a" filter="url(#glow3)"/>
  <circle cx="179" cy="359" r="5" fill="#c8893a" filter="url(#glow3)"/>
  <circle cx="186" cy="235" r="5" fill="#c8893a" filter="url(#glow3)"/>

  <!-- Center point -->
  <circle cx="290" cy="295" r="4" fill="#e8b46a" filter="url(#glow3)"/>

  <!-- Skill Labels -->
  <text x="290" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#e8b46a" font-weight="bold">ORDER-TO-CASH</text>
  <text x="290" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">95%</text>

  <text x="448" y="218" text-anchor="start" font-family="'Courier New', monospace" font-size="11" fill="#e8b46a" font-weight="bold">PRICING</text>
  <text x="448" y="231" text-anchor="start" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">95%</text>

  <text x="440" y="368" text-anchor="start" font-family="'Courier New', monospace" font-size="11" fill="#e8b46a" font-weight="bold">BILLING</text>
  <text x="440" y="381" text-anchor="start" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">90%</text>

  <text x="290" y="460" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#e8b46a" font-weight="bold">LOGISTICS EXEC</text>
  <text x="290" y="473" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">85%</text>

  <text x="138" y="368" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#e8b46a" font-weight="bold">INTEGRATION</text>
  <text x="138" y="381" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">80%</text>

  <text x="152" y="222" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#e8b46a" font-weight="bold">S/4HANA</text>
  <text x="152" y="235" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#7a9cc8">88%</text>

  <!-- ── RIGHT SIDE: SKILL BREAKDOWN CARDS ── -->
  <line x1="570" y1="85" x2="570" y2="495" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>

  <!-- Column header -->
  <text x="725" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#c8893a" letter-spacing="2">SKILL BREAKDOWN</text>

  <!-- OTC -->
  <rect x="585" y="112" width="290" height="58" rx="8" fill="#0f1a2e" stroke="#c8893a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="585" y="112" width="4" height="58" rx="2" fill="#c8893a"/>
  <text x="600" y="128" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" font-weight="bold">ORDER-TO-CASH</text>
  <text x="600" y="143" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Sales Orders · Copy Control · ATP · Credit Mgmt</text>
  <text x="600" y="158" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Item Categories · Partner Functions · Contracts</text>

  <!-- Pricing -->
  <rect x="585" y="178" width="290" height="58" rx="8" fill="#0f1a2e" stroke="#c8893a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="585" y="178" width="4" height="58" rx="2" fill="#c8893a"/>
  <text x="600" y="194" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" font-weight="bold">ADVANCED PRICING</text>
  <text x="600" y="209" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Condition Technique · Access Sequences · Tables</text>
  <text x="600" y="224" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Exclusion Groups · Scales · VOFM Routines</text>

  <!-- S4HANA -->
  <rect x="585" y="244" width="290" height="58" rx="8" fill="#0f1a2e" stroke="#4a7ab8" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="585" y="244" width="4" height="58" rx="2" fill="#4a7ab8"/>
  <text x="600" y="260" font-family="'Courier New', monospace" font-size="10" fill="#4a7ab8" font-weight="bold">S/4HANA</text>
  <text x="600" y="275" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Brownfield · Business Partner · Fiori · aATP</text>
  <text x="600" y="290" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Clean Core · BRF+ · Public Cloud · SSCUI</text>

  <!-- Billing -->
  <rect x="585" y="310" width="290" height="58" rx="8" fill="#0f1a2e" stroke="#c8893a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="585" y="310" width="4" height="58" rx="2" fill="#c8893a"/>
  <text x="600" y="326" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" font-weight="bold">BILLING &amp; REVENUE</text>
  <text x="600" y="341" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Billing Plans · Invoice Lists · Credit/Debit Memos</text>
  <text x="600" y="356" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Intercompany · Milestone · VKOA Account Det.</text>

  <!-- Integration -->
  <rect x="585" y="376" width="290" height="58" rx="8" fill="#0f1a2e" stroke="#c8893a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="585" y="376" width="4" height="58" rx="2" fill="#c8893a"/>
  <text x="600" y="392" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" font-weight="bold">INTEGRATION &amp; EDI</text>
  <text x="600" y="407" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">SD-FI · SD-MM · SD-PP · ALE · IDocs · X12</text>
  <text x="600" y="422" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">EDIFACT · Output Management · NACE · BRF+</text>

  <!-- Delivery LE -->
  <rect x="585" y="442" width="290" height="44" rx="8" fill="#0f1a2e" stroke="#c8893a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="585" y="442" width="4" height="44" rx="2" fill="#c8893a"/>
  <text x="600" y="458" font-family="'Courier New', monospace" font-size="10" fill="#c8893a" font-weight="bold">LOGISTICS EXECUTION</text>
  <text x="600" y="473" font-family="Georgia, serif" font-size="10" fill="#7a9cc8">Shipping · Route Det. · PGI · WM · Transportation</text>

  <!-- Footer -->
  <text x="450" y="508" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#1a2a40" letter-spacing="2">PRASHANTH GOUD · SAP SD / S/4HANA · github.com/prashanth-sap-sd</text>
</svg>
